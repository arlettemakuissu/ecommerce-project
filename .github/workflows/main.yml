name: Build, Push and Deploy

on:
  push:
    branches: [ "developd" ] # Se déclenche à chaque push sur developd
  workflow_dispatch:        # Permet aussi de le lancer manuellement depuis l'onglet Actions

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/product-service
          file: ./backend/product-service/Dockerfile # Adaptez le chemin vers votre Dockerfile si nécessaire
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to remote server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest
            docker stop ecommerce-app || true
            docker rm ecommerce-app || true
            docker run -d --name ecommerce-app -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/ecommerce-backend:latest
